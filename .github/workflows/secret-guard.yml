name: secret-guard

# This repo is public. From 2026-08-10 to 2026-10-07 it carried the ACPL2 native-lane
# license-signing secret in a vendored header; the secret was rotated and now lives only in a
# gitignored ACPLicenseSecret.h. This job fails any push or PR that brings key material back.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  no-license-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject license-signing key material in tracked files
        run: python3 .github/scripts/check_no_license_secret.py
